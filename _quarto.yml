project:
  type: website
  resources:
    - img/

# Release deploy target is derived from the branch name (`release-YYMM` -> `YYMM/`).
# This file only configures the Quarto course site itself.

website:
  title: "Using AI in lifescience - A primer"
  sidebar:
    style: "floating"
    background: "#F4F6F6"
    fontsize: 30px
    search: true
    contents: 
      - index.qmd 
      - schedule.qmd
      - instructors.qmd
      - name:
          Agentic AI
        href: 1_agentic_ai.qmd
      - name:
          Cybersecurity
        href: 2_cybersecurity.qmd
      - name:
          xAI
        href: 3_xAI.qmd
      - name:
          Ethics and Legal
        href: 4_ethics_legal.qmd
  navbar:
    background: "#075a63"
    # The three partner logos are inserted by _includes/navbar-logos.html,
    # because `logo:` here would only accept a single image.
  favicon: "img/SciLifeLab_Logotype_NEG.png"


format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body: _includes/navbar-logos.html
    toc: true

execute:
  freeze: auto
